name: Build Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
        root-reserve-mb: 512
        swap-size-mb: 1024
        build-mount-path: /var/lib/docker
        overprovision-lvm: 'true'

    - name: Restart Docker after disk remount
      run: |
        sudo systemctl restart docker
        sleep 5

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Check disk space after maximizing
      run: |
        echo "=== Disk usage ==="
        df -hT
        echo ""
        echo "=== Mount points ==="
        mount | grep -E '^/dev/'
        echo ""
        echo "=== Docker directory ==="
        ls -la /var/lib/docker || echo "Docker directory not yet created"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract NVHPC base image from Dockerfile
      id: extract_version
      run: |
        BASE_IMAGE=$(grep -oP '^FROM\s+nvcr\.io/nvidia/nvhpc:\K\S+' Dockerfile | head -n1)
        BASE_IMAGE=${BASE_IMAGE%%@*}
        if [ -z "$BASE_IMAGE" ]; then
          echo "Could not extract NVHPC base image tag from Dockerfile" >&2
          exit 1
        fi
        echo "base_tag=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
        echo "Extracted NVHPC base image: $BASE_IMAGE"

    - name: Determine Docker image name
      id: image
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        if [ -n "$DOCKER_USERNAME" ]; then
          echo "image=$DOCKER_USERNAME/nvhpc" >> "$GITHUB_OUTPUT"
          echo "cache_from=type=registry,ref=$DOCKER_USERNAME/nvhpc:latest" >> "$GITHUB_OUTPUT"
        else
          echo "image=nvhpc" >> "$GITHUB_OUTPUT"
          echo "cache_from=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: |
          ${{ steps.image.outputs.image }}:${{ steps.extract_version.outputs.base_tag }}-hdf5
          ${{ steps.image.outputs.image }}:latest
        cache-from: ${{ steps.image.outputs.cache_from }}
        cache-to: type=inline
